name: runner-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  runner-tests:
    name: runner-tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # These tests use fake local task files; they never start a model CLI.
      - run: python -m unittest discover -s runner_tests -t . -v
      # The committed results page must match the run folders it is built from.
      - run: python run_experiment.py results --check
